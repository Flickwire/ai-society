name: Rust CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint with Clippy
        # Existing pedantic/documentation findings are advisory until the
        # repository completes a dedicated lint-cleanup pass. Correctness and
        # suspicious-code diagnostics are hard errors now.
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D clippy::correctness -D clippy::suspicious

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Compile release binaries
        run: cargo build --workspace --release --locked
