[workspace]
resolver = "2"
members = [
    "crates/society-domain",
    "crates/society-sim",
    "crates/society-inference",
    "crates/society-storage",
    "crates/society-headless",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
